[project]
name = "consultationlist"
version = "0.1.0"
description = "A simple consultation list management app for KuB internal use"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-camel-case>=1.4.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    "ruff>=0.17.6",
]
test = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "consultationlist.settings"
python_files = ["tests.py", "test_*.py"]
pythonpath = "."
markers = [
    "wip: work in progress tests",
    "only: run only selected tests",
]

[tool.ruff]
exclude = ["**/migrations/**"]
