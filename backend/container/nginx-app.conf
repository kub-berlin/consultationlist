server {
  listen 80 default_server;
  client_max_body_size 128m;
  root /var/lib/consultationlist/public/;

  location / {
    try_files $uri @consultationlist-app;
  }

  location @consultationlist-app {
    proxy_pass http://backend:8000;
    # Pass the original host so Django's ALLOWED_HOSTS, redirects and CSRF checks
    # use the public domain instead of "backend:8000"
    proxy_set_header Host $host;
    # on docker network use http port 80
  }

  # This will be needed when WebSockets are used
  location /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }
}
