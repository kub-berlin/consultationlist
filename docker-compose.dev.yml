#!!!DON'T YOUS THIS COMPOSE FILE FOR PRODUCTION. ONLY FOR DEV PURPOSES!!!!

services:
  backend:
    build:
      dockerfile: ./Dockerfile
      args:
        UV_FLAGS: --all-groups
      context: .
    env_file:
      - .env.dev # Use .env in production
    environment:
      CONSULTATIONLIST_DATA_DIR: '/var/lib/consultationlist'
    volumes:
      - consultationlist-data:/var/lib/consultationlist
    develop:
      watch:
        - path: ./backend/consultationlist
          target: /app/consultationlist
          action: sync+restart
        - path: ./backend/uv.lock
          action: rebuild
        - path: Dockerfile
          action: rebuild

  nginx:
    image: nginx
    depends_on: [backend]
    volumes:
      - ./backend/container/nginx-app.conf:/etc/nginx/conf.d/default.conf:ro
      - consultationlist-data:/var/lib/consultationlist:ro

    ports: ['127.0.0.1:1234:80']

volumes:
  consultationlist-data:
